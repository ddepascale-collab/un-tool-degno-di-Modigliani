
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta DOOH &amp; OOH — Gamestop</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --da-violet:#AF92FF; --da-green:#01634C; --da-dark:#0A2D2D; --da-light:#F5FFFE;
  --panel:#ffffff; --panel-2:#f0f3f6; --line:rgba(10,45,45,.12);
  --ink:#0A2D2D; --ink-dim:#5a6675; --ink-faint:#98a3b2;
  --accent:#1f9e82; --digital:#2f6fd6; --static:#e08a00;
  --radius:10px; --shadow:0 4px 20px rgba(10,45,45,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',sans-serif;background:var(--da-light);color:var(--da-dark)}
#landing{position:fixed;inset:0;background:var(--da-light);display:flex;align-items:stretch;justify-content:center;overflow-y:auto;z-index:10}
#landing .lp-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#landing .lp-bg::before{content:'';position:absolute;top:-340px;left:-260px;width:460px;height:460px;border-radius:50%;background:var(--da-dark)}
.lp-inner{position:relative;z-index:2;width:100%;max-width:900px;padding:60px 48px;display:flex;flex-direction:column;align-items:flex-start;min-height:100%}
.lp-logo{display:flex;align-items:center;margin-bottom:26px}
.lp-logo img{height:32px;display:block}
.lp-eyebrow{font-family:'Space Mono';font-size:11px;letter-spacing:2px;color:var(--da-green);text-transform:uppercase;margin-bottom:18px}
.lp-title{font-size:clamp(28px,4vw,44px);font-weight:800;line-height:1.15;margin-bottom:10px}
.lp-title .hl{color:var(--da-violet)}
.lp-date{font-family:'Space Mono';font-size:13px;color:rgba(10,45,45,.55);margin-bottom:34px}
.lp-stats{font-family:'Space Mono';font-size:13px;color:rgba(10,45,45,.6);margin-bottom:44px}
.lp-card{border:1px solid var(--line);border-radius:16px;padding:28px 26px;background:#fff;box-shadow:var(--shadow);cursor:pointer;max-width:420px;transition:.15s}
.lp-card:hover{border-color:var(--da-green);transform:translateY(-2px)}
.lp-card .ic{font-size:26px;margin-bottom:14px}
.lp-card h3{font-size:19px;font-weight:700;color:var(--da-green);margin-bottom:8px}
.lp-card p{font-size:13.5px;color:rgba(10,45,45,.65);line-height:1.5}
#app{position:fixed;inset:0;display:none;flex-direction:column;z-index:5}
#app.show{display:flex}
header{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
header .back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-family:'Archivo';font-size:12.5px;font-weight:700;cursor:pointer;color:var(--da-dark)}
header .ttl{font-weight:800;font-size:14.5px}
.app-body{display:flex;flex:1;min-height:0}
aside{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow-y:auto}
main{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#e8edf1}
.sec{padding:15px 18px;border-bottom:1px solid var(--line)}
.sec-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:11px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-family:'Archivo';
  font-size:12.5px;font-weight:600;color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s}
.seg button .sw{width:9px;height:9px;border-radius:50%}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,45,.14)}
.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:9px 11px;border-radius:8px;font-size:13px;font-family:'Archivo',sans-serif}
.search:focus{outline:none;border-color:var(--accent)}
.search::placeholder{color:var(--ink-faint)}
.geo-wrap{position:relative}
.geo-results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);z-index:600;max-height:240px;overflow-y:auto;display:none}
.geo-results.show{display:block}
.geo-results .gr{padding:9px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);line-height:1.35}
.geo-results .gr:last-child{border-bottom:0}
.geo-results .gr:hover{background:var(--panel-2)}
.geo-results .gr .gr-main{font-weight:600;color:var(--ink)}
.geo-results .gr .gr-sub{font-size:11px;color:var(--ink-faint)}
.geo-results .gr-empty{padding:11px;font-size:12px;color:var(--ink-faint);text-align:center}
#geo-clear{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:8px;
  font-family:'Archivo';font-size:12px;font-weight:600;color:var(--ink-dim);cursor:pointer;margin-top:10px;display:none}
#geo-clear:hover{color:var(--ink);border-color:#c4ccd8}
.geo-pin{filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.pv-count{font-family:'Space Mono';font-size:26px;font-weight:700;color:var(--da-dark)}
.legend{position:absolute;left:14px;bottom:20px;z-index:500;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px;box-shadow:var(--shadow)}
.legend .li{display:flex;align-items:center;gap:8px;margin:4px 0}
.legend .r{width:11px;height:11px;border-radius:50%}
.pv-recenter-btn{position:absolute;right:14px;top:14px;z-index:500;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:8px 13px;font-family:'Archivo';font-size:12.5px;font-weight:700;color:var(--da-dark);
  cursor:pointer;box-shadow:var(--shadow)}
.pv-recenter-btn:hover{border-color:var(--da-green);color:var(--da-green)}
.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content{font-family:'Archivo',sans-serif;min-width:210px}
.pp-type{display:inline-block;font-family:'Space Mono';font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:5px;margin-bottom:8px;font-weight:700}
.pp-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:8px 0}
.pp-grid .k{color:rgba(10,45,45,.5)}
.pp-btn{display:block;text-align:center;margin-top:10px;border:1px solid var(--da-green);color:var(--da-green);border-radius:9px;padding:8px;font-size:12.5px;font-weight:700;text-decoration:none}
</style>
</head>

<script>
const POSITIONS=[{"la":41.9223465,"ln":12.5039622,"d":true,"ex":{"Città":"Roma","Indirizzo":"Via chiana 110"}},{"la":41.9227102,"ln":12.5119119,"d":true,"ex":{"Città":"Roma","Indirizzo":"Corso Trieste 146"}},{"la":41.8778398,"ln":12.4722339,"d":true,"ex":{"Città":"Roma","Indirizzo":"Via Giovanni Battista Bodoni 96 "}},{"la":41.9352553,"ln":12.5289046,"d":true,"ex":{"Città":"Roma","Indirizzo":"Via Val D'Ossola 4"}},{"la":41.9203541,"ln":12.525034,"d":true,"ex":{"Città":"Roma","Indirizzo":"Cesare Rasponi 10"}},{"la":45.4495103,"ln":9.1772192,"d":true,"ex":{"Città":"Milano","Indirizzo":"Alzaia Naviglio Pavese 20"}},{"la":45.4866847,"ln":9.1860306,"d":true,"ex":{"Città":"Milano","Indirizzo":"Via pastrengo 30"}},{"la":45.4060805,"ln":9.2697149,"d":true,"ex":{"Città":"Milano","Indirizzo":"Via Certosa 12"}}];
const state={kind:'all'};
let markersAll=[], cluster, map, geoMarker=null;

document.getElementById('go-map').onclick=()=>{
  document.getElementById('landing').style.display='none';
  document.getElementById('app').classList.add('show');
  if(!window.__mapInit){ window.__mapInit=true; initMap(); }
  else if(map){ map.invalidateSize(); }
};
document.getElementById('back-btn').onclick=()=>{
  document.getElementById('app').classList.remove('show');
  document.getElementById('landing').style.display='flex';
};

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function sv(lat,lng){return 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+lat+','+lng;}

function popupHtml(p){
  const kc=p.d?'var(--digital)':'var(--static)', klabel=p.d?'Digital':'Statico';
  let g='';
  Object.keys(p.ex||{}).forEach(k=>{ g+='<span class="k">'+esc(k)+'</span><span>'+esc(p.ex[k])+'</span>'; });
  const svBtn='<a class="pp-btn" href="'+sv(p.la,p.ln)+'" target="_blank" rel="noopener">Apri in Street View ↗</a>';
  return '<span class="pp-type" style="background:'+kc+'1f;color:'+kc+'">'+klabel+'</span><div class="pp-grid">'+g+'</div>'+svBtn;
}

function applyFilter(){
  cluster.clearLayers();
  // Inserimento in blocco (addLayers) invece che uno alla volta: con molti posizionamenti
  // aggiungerli singolarmente (addLayer in un ciclo) può bloccare a lungo il browser.
  const toAdd=[];
  markersAll.forEach(mm=>{
    if(state.kind==='all' || (state.kind==='d'&&mm.d) || (state.kind==='s'&&!mm.d)) toAdd.push(mm.marker);
  });
  cluster.addLayers(toAdd);
  document.getElementById('pv-count').textContent=toAdd.length.toLocaleString('it-IT');
}

function initMap(){
  map=L.map('map',{preferCanvas:true,maxZoom:14}).setView([42.5,12.5],6);
  // GitHub Pages: mappa OpenStreetMap via HTTPS, come nella mappa principale.
  // Attribuzione OSM mantenuta come richiesto dalla licenza delle tile.
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
  cluster=L.markerClusterGroup({maxClusterRadius:50});
  map.addLayer(cluster);
  const bounds=[];
  POSITIONS.forEach(p=>{
    const col=p.d?'#2f6fd6':'#e08a00';
    const icon=L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],
      html:'<div style="background:'+col+';width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px '+col+',0 1px 3px rgba(0,0,0,.3)"></div>'});
    const m=L.marker([p.la,p.ln],{icon});
    m.bindPopup(()=>popupHtml(p));
    markersAll.push({marker:m,d:p.d});
    bounds.push([p.la,p.ln]);
  });
  map.invalidateSize();
  applyFilter();

  // Il contenitore #map parte da display:none: le sue dimensioni reali sono note al browser solo
  // dopo il layout. Oltre al ResizeObserver, aggiungiamo alcuni tentativi extra ravvicinati come
  // rete di sicurezza, e un pulsante per ricentrare manualmente se qualcosa va storto comunque.
  function settle(){
    map.invalidateSize();
    if(bounds.length){ try{ map.fitBounds(bounds,{padding:[40,40],maxZoom:14}); }catch(e){} }
  }
  settle();
  setTimeout(settle,150);
  setTimeout(settle,600);
  setTimeout(settle,1200);
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>settle());
    ro.observe(document.getElementById('map'));
  }
  const recenterBtn=document.createElement('button');
  recenterBtn.textContent='⤢ Centra sui posizionamenti';
  recenterBtn.className='pv-recenter-btn';
  recenterBtn.onclick=settle;
  document.querySelector('main').appendChild(recenterBtn);

  document.querySelectorAll('#kindSeg button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#kindSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state.kind=b.dataset.k; applyFilter();
  });

  // --- Ricerca indirizzo/zona con zoom automatico (stessa logica del tool principale) ---
  const geoInput=document.getElementById('geo-input'), geoResults=document.getElementById('geo-results'), geoClear=document.getElementById('geo-clear');
  let geoTimer;
  geoInput.addEventListener('input',e=>{
    const q=e.target.value.trim(); clearTimeout(geoTimer);
    if(q.length<3){ geoResults.classList.remove('show'); return; }
    geoTimer=setTimeout(()=>runGeocode(q),400);
  });
  geoInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); const q=e.target.value.trim(); if(q.length>=3) runGeocode(q,true); }
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.geo-wrap')) geoResults.classList.remove('show'); });
  geoClear.onclick=()=>{
    if(geoMarker){ map.removeLayer(geoMarker); geoMarker=null; }
    geoInput.value=''; geoClear.style.display='none';
  };

  async function runGeocode(q, pickFirst){
    geoResults.innerHTML='<div class="gr-empty">Ricerca in corso…</div>';
    geoResults.classList.add('show');
    try{
      const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=it&q='+encodeURIComponent(q);
      const res=await fetch(url,{headers:{'Accept-Language':'it'}});
      const data=await res.json();
      if(!data.length){ geoResults.innerHTML='<div class="gr-empty">Nessun indirizzo trovato</div>'; return; }
      if(pickFirst){ selectGeo(data[0]); return; }
      geoResults.innerHTML='';
      data.forEach(d=>{
        const el=document.createElement('div'); el.className='gr';
        const parts=d.display_name.split(', ');
        el.innerHTML='<div class="gr-main">'+esc(parts.slice(0,2).join(', '))+'</div><div class="gr-sub">'+esc(parts.slice(2).join(', '))+'</div>';
        el.onclick=()=>selectGeo(d);
        geoResults.appendChild(el);
      });
    }catch(err){ geoResults.innerHTML='<div class="gr-empty">Errore di rete. Riprova.</div>'; }
  }

  function selectGeo(d){
    const lat=parseFloat(d.lat), lng=parseFloat(d.lon), pt=[lat,lng];
    geoResults.classList.remove('show');
    geoInput.value=d.display_name.split(', ').slice(0,3).join(', ');
    geoClear.style.display='block';
    if(geoMarker) map.removeLayer(geoMarker);
    const ic=L.divIcon({className:'geo-pin',iconSize:[26,26],iconAnchor:[13,26],
      html:'<svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 0C6.4 0 1 5.4 1 12c0 8 12 14 12 14s12-6 12-14C25 5.4 19.6 0 13 0z" fill="#e0245e"/><circle cx="13" cy="12" r="4.5" fill="#fff"/></svg>'});
    geoMarker=L.marker(pt,{icon:ic,zIndexOffset:1000}).addTo(map);
    map.invalidateSize();
    const bb=d.boundingbox;
    let framed=false;
    if(bb && bb.length===4){
      const south=parseFloat(bb[0]),north=parseFloat(bb[1]),west=parseFloat(bb[2]),east=parseFloat(bb[3]);
      if([south,north,west,east].every(Number.isFinite) && north>south && east>west){
        const boundsGeo=L.latLngBounds([south,west],[north,east]);
        const span=Math.max(north-south,east-west);
        let mz;
        if(span>2)mz=8; else if(span>0.8)mz=9; else if(span>0.3)mz=11; else if(span>0.08)mz=13; else if(span>0.02)mz=15; else mz=17;
        try{ map.flyToBounds(boundsGeo,{padding:[50,50],maxZoom:mz,duration:.6}); framed=true; }
        catch(e){ try{ map.fitBounds(boundsGeo,{padding:[50,50],maxZoom:mz}); framed=true; }catch(e2){} }
      }
    }
    if(!framed){
      const t=(d.addresstype||d.type||'').toLowerCase();
      const z=(t==='state'||t==='region')?8:(t==='county'||t==='province'||t==='state_district')?9:
        (t==='city'||t==='town'||t==='municipality')?12:(t==='village'||t==='suburb')?13:
        (t==='house'||t==='building'||t==='amenity'||t==='shop'||t==='office'||t==='road')?17:16;
      map.flyTo(pt,z,{duration:.6});
    }
  }
}
</script>
